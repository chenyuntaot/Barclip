name: ClipboardHistory
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  ClipboardHistory:
    type: application
    platform: macOS
    sources:
      - path: ClipboardHistory
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ClipboardHistory
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: 剪贴板历史
        ENABLE_HARDENED_RUNTIME: YES
  ClipboardHistoryTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ClipboardHistoryTests]
    dependencies:
      - target: ClipboardHistory
schemes:
  ClipboardHistory:
    build:
      targets:
        ClipboardHistory: all
    test:
      targets: [ClipboardHistoryTests]
