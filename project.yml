name: ClipboardHistory
options:
  deploymentTarget:
    macOS: '14.0'
  developmentLanguage: zh-Hans
  fileTypes:
    icon:
      file: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  ClipboardHistory:
    type: application
    platform: macOS
    productName: Barclip
    sources:
      - path: ClipboardHistory
        excludes: [Info.plist]
      - path: AppIcon.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ClipboardHistory
        PRODUCT_NAME: Barclip
        PRODUCT_MODULE_NAME: ClipboardHistory
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Barclip
        INFOPLIST_KEY_NSHumanReadableCopyright: '© 2026 陈云涛'
        MARKETING_VERSION: '1.0.1'
        CURRENT_PROJECT_VERSION: '2'
        ENABLE_HARDENED_RUNTIME: YES
  ClipboardHistoryTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ClipboardHistoryTests]
    dependencies:
      - target: ClipboardHistory
schemes:
  ClipboardHistory:
    build:
      targets:
        ClipboardHistory: all
    test:
      targets: [ClipboardHistoryTests]
